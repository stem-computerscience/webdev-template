<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <!-- Parent container -->
    <div class="parent">
      <!-- Children -->
      <h2>Child Selector</h2>
      <h4>The child selector (>) selects all elements that are the children of a specified element.</h4>
      <p>Paragraph 1 in the div.</p>
      <p>Paragraph 2 in the div.</p>
      <div class="child">
        <!-- paragraph 3 is a descendant but not a child of the parent container -->
        <p>Paragraph 3 in the div (inside a new container).</p>
      </div>
      <p>Paragraph 4 in the div.</p>
    </div>

    <p>Paragraph 5. Not in the div.</p>
    <p>Paragraph 6. Not in the div.</p>

    <!-- div container with a class attribute around the 4 images -->
    <div class="container-1">
      <img class="special" src="one.jpg" alt="one">
      <img class="special" src="two.jpg" alt="two">
      <img src="three.jpg" alt="three">
      <img src="four.jpg" alt="four">
    </div>
    
    <!-- images not in a container -->
    <img src="five.jpg" alt="five">
    <img src="six.jpg" alt="six">




  </body>
</html>
