name: Fetch level starter images

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download images
        run: |
          set -e
          L06="chapter-2-multi-page-websites/lesson-18-css-pseudo-classes/level-06"
          L07="chapter-2-multi-page-websites/lesson-18-css-pseudo-classes/level-07"
          mkdir -p "$L06" "$L07"

          curl -fL -o "$L06/nature.png" "https://studio.code.org/level_starter_assets/CSD%20U2L18-L6a-2025/uuid/76bb5ace-0ef3-4d9c-845e-35588a94a8c1.png"
          curl -fL -o "$L06/helping.png" "https://studio.code.org/level_starter_assets/CSD%20U2L18-L6a-2025/uuid/96782b63-49c5-4226-b31b-f177041a597b.png"

          curl -fL -o "$L07/world-design.png" "https://studio.code.org/level_starter_assets/CSD%20U2L18-L7-2025/uuid/a2c24941-0768-4b16-b190-35aa4c578621.png"
          curl -fL -o "$L07/character-design.png" "https://studio.code.org/level_starter_assets/CSD%20U2L18-L7-2025/uuid/7081bcca-3b7f-4578-90c4-dd194afa5597.png"
          curl -fL -o "$L07/enemy-design.png" "https://studio.code.org/level_starter_assets/CSD%20U2L18-L7-2025/uuid/af570d1d-aae5-42a1-8e0b-e45560f573ce.png"
          curl -fL -o "$L07/code.png" "https://studio.code.org/level_starter_assets/CSD%20U2L18-L7-2025/uuid/bdee0d58-14d1-408f-86a8-1a88bed8a592.png"

          ls -la "$L06" "$L07"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "chapter-2-multi-page-websites/lesson-18-css-pseudo-classes/level-06" "chapter-2-multi-page-websites/lesson-18-css-pseudo-classes/level-07"
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "Add real image assets for Lesson 18 levels 6 and 7"
          git push
